# EAS Update Workflow - Automatic OTA Update on Main Branch Merge
#
# This workflow automatically publishes OTA (Over-The-Air) updates to iOS/Android
# when changes are merged to the main branch. Updates are delivered instantly
# without requiring App Store review.
#
# Prerequisites:
# 1. EXPO_TOKEN secret must be set in GitHub repository settings
#    - Go to https://expo.dev/accounts/[account]/settings/access-tokens
#    - Create a new token and add it as EXPO_TOKEN secret
# 2. Initial build must be created with EAS Build (with expo-updates included)
#
# Note: OTA updates only work for JavaScript/TypeScript code changes.
# Native code changes (new native modules, config changes) require a new build.

name: EAS Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message (optional)'
        required: false
        type: string

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'

jobs:
  # Run tests before publishing update
  test:
    name: Test Before Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci --watchAll=false
        env:
          CI: true

  # Publish OTA update after tests pass
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update to production channel
        run: |
          eas update \
            --branch production \
            --message "${{ inputs.message || format('Auto update from {0} - {1}', github.ref_name, github.sha) }}" \
            --non-interactive

      - name: Update Summary
        run: |
          echo "## OTA Update Published 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Channel:** production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What happens next?" >> $GITHUB_STEP_SUMMARY
          echo "- Users with the app installed will receive the update automatically" >> $GITHUB_STEP_SUMMARY
          echo "- Update is delivered on next app launch (or within ~30 seconds if app is open)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the [Expo Dashboard](https://expo.dev/accounts/terisuke/projects/yukifura-seiya/updates) for update status." >> $GITHUB_STEP_SUMMARY

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, update]
    if: failure()

    steps:
      - name: Create failure summary
        run: |
          echo "## ❌ OTA Update Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
