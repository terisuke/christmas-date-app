# EAS Build Workflow for Expo/React Native Application
# Manual trigger for building iOS and Android apps via Expo Application Services (EAS)
#
# Prerequisites:
# 1. Create an Expo account at https://expo.dev
# 2. Install EAS CLI: npm install -g eas-cli
# 3. Configure EAS: eas build:configure
# 4. Create EXPO_TOKEN secret in GitHub repository settings
#    - Go to https://expo.dev/accounts/[account]/settings/access-tokens
#    - Create a new token and add it as EXPO_TOKEN secret

name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production
      message:
        description: 'Build message (optional)'
        required: false
        type: string

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    name: EAS Build (${{ inputs.platform }} - ${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Validate Expo configuration before build
      - name: Validate Expo config
        run: npx expo-doctor
        continue-on-error: true

      # Build for all platforms
      - name: Build for all platforms
        if: inputs.platform == 'all'
        run: |
          eas build \
            --platform all \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            ${{ inputs.message && format('--message "{0}"', inputs.message) || '' }}

      # Build for iOS only
      - name: Build for iOS
        if: inputs.platform == 'ios'
        run: |
          eas build \
            --platform ios \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            ${{ inputs.message && format('--message "{0}"', inputs.message) || '' }}

      # Build for Android only
      - name: Build for Android
        if: inputs.platform == 'android'
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            ${{ inputs.message && format('--message "{0}"', inputs.message) || '' }}

      # Output build information
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** ${{ inputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** ${{ inputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the [Expo Dashboard](https://expo.dev) for build status and download links." >> $GITHUB_STEP_SUMMARY


  # Optional: Notify on build completion
  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Build notification
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "Build completed successfully!"
          else
            echo "Build failed. Please check the logs."
          fi
